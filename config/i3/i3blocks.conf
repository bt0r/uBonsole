# uBonsole — i3blocks status bar (left to right)
# Signals: 10 volume, 11 brightness, 12 battery, 13 radio apps, 14 Wi-Fi
command=/usr/share/i3blocks/$BLOCK_NAME
separator_block_width=15
markup=none
# Accent color (reference pink, swapped by install.sh)
color=#E09AB4

# Radio: click = SDR frequency cheat sheet
[radio]
command=~/.config/i3/scripts/radio
interval=once

# Ear: click = radio app launcher (ADS-B, SDR++, Meshcore...). Shows the active SDR app
[apps]
command=~/.config/i3/scripts/apps
interval=10
signal=13

# Left click +1 / right click -1
[brightness]
command=~/.config/i3/scripts/brightness
interval=10
signal=11

# Left click = mute, wheel = +/- 5 %
[volume]
command=~/.config/i3/scripts/volume
interval=5
signal=10

[cpu]
command=~/.config/i3/scripts/cpu
interval=3

[memory]
command=~/.config/i3/scripts/memory
interval=5

[temperature]
label=
command=~/.config/i3/scripts/temperature
interval=10

# Wi-Fi: IP when connected, crossed-out icon when Wi-Fi is off. Right click copies the IP
[wifi]
command=~/.config/i3/scripts/wifi
markup=pango
interval=5
signal=14

[time]
label=
# Date and time in the region's format (DATE_FORMAT in ubonsole.conf)
command=~/.config/i3/scripts/clock
interval=5

# Click = power menu (Wi-Fi, Bluetooth, GPS, LoRa, SDR, USB)
[battery]
command=~/.config/i3/scripts/battery
interval=10
signal=12
