# uBonsole — i3blocks status bar (left to right)
# Signals: 10 volume, 11 brightness, 12 battery, 13 radio apps
command=/usr/share/i3blocks/$BLOCK_NAME
separator_block_width=15
markup=none
color=#E09AB4

# Radio: click = SDR frequency cheat sheet
[radio]
command=~/.config/i3/scripts/radio
interval=once

# Ear: click = radio app launcher (ADS-B, SDR++, Meshcore...). Shows the active SDR app
[apps]
command=~/.config/i3/scripts/apps
interval=10
signal=13

# Left click +1 / right click -1
[brightness]
command=~/.config/i3/scripts/brightness
interval=10
signal=11

# Left click = mute, wheel = +/- 5 %
[volume]
command=~/.config/i3/scripts/volume
interval=5
signal=10

[cpu]
command=~/.config/i3/scripts/cpu
interval=3

[memory]
command=~/.config/i3/scripts/memory
interval=5

[temperature]
label=
command=~/.config/i3/scripts/temperature
interval=10

# Wi-Fi IP address (right click copies it)
[iface]
label=
instance=wlan0
interval=10

[time]
label=
command=date '+%d/%m/%Y %H:%M'
interval=1

# Click = power menu (Wi-Fi, Bluetooth, GPS, LoRa, SDR, USB)
[battery]
command=~/.config/i3/scripts/battery
interval=10
signal=12
